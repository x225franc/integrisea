# Protocole réellement utilisé par le navigateur : si un proxy TLS en amont (voir deploy/nginx-tls.conf.example) a déjà posé
# X-Forwarded-Proto: https, on le conserve ; sinon on prend le schéma de cette connexion. L'API en déduit l'attribut Secure des cookies.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 26m;   # documents (25 Mo max côté API)

    # En-têtes de sécurité. HSTS : à activer derrière un proxy HTTPS (voir deploy/nginx-tls.conf.example).
    # Attention : un add_header dans un bloc location remplace ceux du serveur, d'où les répétitions ci-dessous.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
        # L'API fixe elle-même ses en-têtes de sécurité (helmet, fichiers) : on ne les duplique pas.
        # Un add_header dans ce bloc empêche l'héritage de ceux du serveur ci-dessus.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    location / { try_files $uri /index.html; }
}
