<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IntegriSea — Asset Integrity Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0e2233; --navy2:#16324a; --ink:#17202a; --muted:#5d6b78; --line:#dfe4ea; --bg:#f4f6f8; --card:#fff;
  --accent:#0b7a8a; --accent2:#e6f3f5;
  --L:#2e9d5b; --M:#e0b400; --MH:#ec7a1c; --H:#d0342c;
  --Lbg:#e3f4ea; --Mbg:#fdf5d6; --MHbg:#fde9d8; --Hbg:#fbe1df;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45}
.mono{white-space:nowrap;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--navy);color:#cfdbe6;padding:18px 0;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:0 20px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.brand b{display:block;color:#fff;font-size:18px;letter-spacing:.2px}
.brand span{font-size:12px;color:#8fa6ba}
nav a{display:flex;align-items:center;gap:10px;padding:9px 20px;color:#cfdbe6;text-decoration:none;font-size:14px;border-left:3px solid transparent}
nav a:hover{background:rgba(255,255,255,.05)}
nav a.on{background:var(--navy2);color:#fff;border-left-color:#4fc3d1}
nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#6f879b;padding:14px 20px 4px}
nav svg{width:16px;height:16px;flex:none;opacity:.85}
main{min-width:0}
.top{display:flex;gap:12px;align-items:center;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top h1{font-size:18px;margin:0 auto 0 0;font-weight:600}
.disclaimer{background:#fff8e1;border-bottom:1px solid #f1e2a6;color:#6b5a14;font-size:12.5px;padding:6px 24px}
.content{padding:20px 24px 60px}
select,input,textarea{font:inherit;border:1px solid #c9d1d9;border-radius:6px;padding:6px 8px;background:#fff;color:var(--ink)}
textarea{width:100%;min-height:64px}
input[type=number]{width:110px}
.btn{border:1px solid #c9d1d9;background:#fff;border-radius:6px;padding:6px 12px;color:var(--ink)}
.btn:hover{background:#f1f4f6}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#09697a}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.danger{color:var(--H);border-color:#e9b7b3}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g6{grid-template-columns:repeat(6,1fr)} .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h3{margin:0 0 12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .sub{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:auto}
.kpi .v{font-size:28px;font-weight:600;line-height:1.1}
.kpi .l{color:var(--muted);font-size:12.5px;margin-top:4px}
.kpi.warn .v{color:var(--H)} .kpi.amb .v{color:var(--MH)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--line);background:#fafbfc;position:sticky;top:0;cursor:default;white-space:nowrap}
.tbl th.s{cursor:pointer} .tbl th.s:hover{color:var(--ink)}
.tbl td{padding:8px 10px;border-bottom:1px solid #eef1f4;vertical-align:top}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:#f5fafb}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.r-L{background:var(--Lbg);color:#1d6e3f}.r-M{background:var(--Mbg);color:#7a6200}.r-MH{background:var(--MHbg);color:#9c4a07}.r-H{background:var(--Hbg);color:#a3221b}
.s-ov{background:var(--Hbg);color:#a3221b}.s-due{background:var(--MHbg);color:#9c4a07}.s-ok{background:#eef1f4;color:#4a5865}
.c-A{background:#20384f;color:#fff}.c-B{background:#7f97ad;color:#fff}.c-C{background:#e2e8ee;color:#33414e}
.p-P1{background:var(--H);color:#fff}.p-P2{background:var(--MH);color:#fff}.p-P3{background:var(--M);color:#3d3100}.p-P4{background:#c9d1d9;color:#26323d}
.chip{display:inline-block;background:var(--accent2);color:#085c68;border-radius:4px;padding:1px 6px;margin:1px 3px 1px 0;font-size:12px;cursor:pointer}
.muted{color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar .sp{flex:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:8px 14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
/* matrix */
.mx{display:grid;grid-template-columns:28px repeat(5,1fr);gap:3px;font-size:12px}
.mx .cell{aspect-ratio:1.5;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;cursor:pointer;border:2px solid transparent;user-select:none}
.mx .cell.sel{border-color:var(--ink)}
.mx .cell .z{opacity:.35;font-weight:400}
.mx .ax{display:flex;align-items:center;justify-content:center;color:var(--muted)}
.mx .cL{background:#bfe6cd}.mx .cM{background:#f8e79a}.mx .cMH{background:#f9c393}.mx .cH{background:#f2a39e}
.mxlab{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px}
/* tree */
.tree{font-size:13.5px}
.tree .f{font-weight:600;padding:6px 8px;border-radius:6px;cursor:pointer}
.tree .s{padding:5px 8px 5px 22px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between}
.tree .on{background:var(--accent2);color:#085c68}
.tree div:hover{background:#eef3f6}
/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(14,34,51,.35);z-index:20;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,100vw);background:#fff;z-index:21;box-shadow:-8px 0 30px rgba(0,0,0,.15);transform:translateX(100%);transition:transform .2s;overflow:auto}
.drawer.on{transform:none}
.dhead{padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.dhead h2{margin:0;font-size:18px}
.dbody{padding:16px 22px 40px}
.dbody h4{margin:22px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 16px}
.kv div>span:first-child{display:block;font-size:11.5px;color:var(--muted)}
.x{position:absolute;right:16px;top:14px;border:0;background:none;font-size:22px;color:var(--muted)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:12px;z-index:31;box-shadow:0 20px 50px rgba(0,0,0,.25);display:none}
.modal.on{display:block}
.mscrim{position:fixed;inset:0;background:rgba(14,34,51,.45);z-index:30;display:none}
.mscrim.on{display:block}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:600;font-size:16px;position:relative}
.modal .mb{padding:16px 20px}
.modal .mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frm label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.frm label.w{grid-column:1/-1}
.frm input,.frm select{width:100%}
.reasons{margin:6px 0 0;padding-left:18px}
.reasons li{margin:2px 0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:8px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.bar{height:10px;border-radius:5px;background:#eef1f4;overflow:hidden}
.bar i{display:block;height:100%}
.hint{font-size:12.5px;color:var(--muted);margin:4px 0 12px}
.pf{display:flex;gap:6px}
.pf label{flex-direction:row;align-items:center;gap:4px;color:var(--ink)}
@media (max-width:1100px){.g6{grid-template-columns:repeat(3,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;padding:8px 0}
  .brand{padding-bottom:8px}
  nav{display:flex;overflow:auto}
  nav .grp{display:none}
  nav a{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:8px 12px}
  nav a.on{border-bottom-color:#4fc3d1}
  .g6{grid-template-columns:1fr 1fr}.g3,.g2,.split{grid-template-columns:1fr!important}
  .kv{grid-template-columns:1fr 1fr}
  .top{position:static}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><b>IntegriSea</b><span>Asset integrity management · demo</span></div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <div class="top">
      <h1 id="title">Dashboard</h1>
      <select id="fac" aria-label="Facility"></select>
      <input id="q" type="search" placeholder="Search tag or description…" style="width:230px">
    </div>
    <div class="disclaimer">Demonstration only. Fictional facilities and data. Calculations are simplified and not validated for engineering decisions. Changes are saved in this browser only.</div>
    <div class="content" id="view"></div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer"></div>
<div class="mscrim" id="mscrim"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

/* ---------------- calculations ---------------- */
function tminOf(a){
  if(!(a.od>0&&a.tnom>0))return null;
  const S=DB.settings.stress[a.mat]||138,P=a.dp*0.1;let t;
  if(a.cls==='PV'||a.cls==='HX'){const R=a.od/2-a.tnom;t=Math.max(P*R/(S-0.6*P),2.5)}
  else t=Math.max(P*a.od/(2*(S+0.4*P)),a.od<=114.3?2.0:2.8);
  return r2(t);
}
function gradeFor(tpl,data){
  if(tpl.id==='UT')return null;
  let g=data.grade?+data.grade:1;
  const pfs=tpl.fields.filter(f=>f.t==='pf');const fails=pfs.filter(f=>data[f.k]==='Fail').length;
  if(tpl.id==='EXD')g=Math.max(g,[1,2,3,4,4,4,4][fails]);else if(fails)g=Math.max(g,3);
  if(tpl.id==='PSV'&&data.set>0&&data.pop>0){const dev=Math.abs(data.pop-data.set)/data.set;if(dev>0.10)g=4;else if(dev>0.03)g=Math.max(g,3)}
  if(tpl.id==='STR'){if(data.crack==='Yes')g=4;else if(+data.coating>30)g=Math.max(g,3)}
  if(tpl.id==='SBT'){if(+data.loose>3)g=Math.max(g,3);else if(+data.loose>0)g=Math.max(g,2)}
  return Math.min(4,g);
}
function computeAll(){
  const byTag={};DB.inspections.forEach(i=>(byTag[i.tag]=byTag[i.tag]||[]).push(i));
  Object.values(byTag).forEach(l=>l.sort((a,b)=>a.date<b.date?-1:1));
  const openAn={};DB.anomalies.filter(a=>a.status!=='Closed').forEach(a=>(openAn[a.tag]=openAn[a.tag]||[]).push(a));
  const out={};
  DB.assets.forEach(a=>{
    const ins=byTag[a.tag]||[];const m={thick:a.od>0&&a.tnom>0,reasons:[],ins};
    m.cof=Math.max(a.crit.s,a.crit.e,a.crit.p);m.crit=m.cof>=4?'A':m.cof===3?'B':'C';m.sce=a.crit.s>=4;
    m.last=ins.length?ins[ins.length-1]:null;
    let pof,base,rlAtLast=null;
    if(m.thick){
      m.tmin=tminOf(a);
      const uts=ins.filter(i=>i.readings&&i.readings.length);
      if(uts.length){
        const g=uts.map(i=>({d:i.date,t:Math.min(...i.readings.map(r=>+r.t))}));const L=g[g.length-1];
        m.crLT=Math.max(0,(a.tnom-L.t)/Math.max(yearsBetween(a.inst+'-07-01',L.d),0.5));
        if(g.length>1){const P=g[g.length-2];m.crST=Math.max(0,(P.t-L.t)/Math.max(yearsBetween(P.d,L.d),0.25))}
        m.cr=Math.max(m.crLT,m.crST||0,0.01);m.tLast=L.t;m.tDate=L.d;m.series=g;
        rlAtLast=(L.t-m.tmin)/m.cr;const since=Math.max(0,yearsBetween(L.d,TODAY));
        m.tEst=r2(L.t-m.cr*since);m.rl=rlAtLast-since;base=L.d;
        pof=m.rl<2?5:m.rl<5?4:m.rl<10?3:m.rl<20?2:1;
        m.reasons.push('Remaining life '+fmt(Math.max(m.rl,0),1)+' y at governing rate '+fmt(m.cr,2)+' mm/y → PoF '+pof);
      }else{pof=3;base=a.inst+'-07-01';m.reasons.push('No thickness data → default PoF 3')}
    }else{
      if(m.last&&m.last.grade){pof=m.last.grade;base=m.last.date;m.reasons.push('Last condition grade '+m.last.grade+' ('+tplName(m.last.tpl)+') → PoF '+pof)}
      else{pof=3;base=a.inst+'-07-01';m.reasons.push('No condition inspection on record → default PoF 3')}
    }
    m.openAn=openAn[a.tag]||[];
    if(m.openAn.some(x=>x.priority==='P1'||x.priority==='P2')){pof=Math.min(5,pof+1);m.reasons.push('Open P1/P2 anomaly → PoF +1')}
    let risk=DB.settings.matrix[pof-1][m.cof-1];let iv=+DB.settings.intervals[risk];
    if(m.thick&&rlAtLast!=null){const cap=Math.max(0,Math.floor(rlAtLast*6));if(cap<iv){iv=cap;m.reasons.push('Interval capped at half the remaining life ('+cap+' months)')}}
    if(CLASS_MAX[a.cls]&&CLASS_MAX[a.cls]<iv){iv=CLASS_MAX[a.cls];m.reasons.push('Interval capped at the '+a.cls+' class maximum ('+iv+' months)')}
    m.interval=iv;m.base=base;m.due=addMonths(base,iv);m.days=daysBetween(TODAY,m.due);
    if(m.days<0&&pof<5){pof+=1;m.reasons.push('Inspection overdue → PoF +1 (reduced confidence)');risk=DB.settings.matrix[pof-1][m.cof-1]}
    m.pof=pof;m.risk=risk;m.status=m.days<0?'Overdue':m.days<=90?'Due ≤ 90 d':'Planned';
    out[a.tag]=m;
  });
  M=out;
}

function sortRows(key,rows,cols){

  return rows.slice().sort((a,b)=>{const x=col.v(a),y=col.v(b);return (x<y?-1:x>y?1:0)*s.d});
}
function table(key,cols,rows,rowAttr){
  rows=sortRows(key,rows,cols);const s=UI.sort[key]||{};

  if(!rows.length)h+='<tr><td colspan="'+cols.length+'" class="muted" style="text-align:center;padding:24px">No records match the current filters.</td></tr>';

function matrixHTML(counts,sel,mode){

      const on=sel&&sel.p===p&&sel.c===c;
      h+='<div class="cell c'+lv+(on?' sel':'')+'" data-a="'+mode+'" data-p="'+p+'" data-c="'+c+'" title="PoF '+p+' × CoF '+c+' — '+RISK_NAME[lv]+'">'+(mode==='mxedit'?'<span style="font-size:12px">'+lv+'</span>':(n?n:'<span class="z">0</span>'))+'</div>';
    }
  }
  h+='<div></div>'+[1,2,3,4,5].map(c=>'<div class="ax">'+c+'</div>').join('')+'</div>';
  return h+'<div class="mxlab"><span>↑ Probability of failure (PoF)</span><span>Consequence of failure (CoF) →</span></div>';
}

function trendSVG(a,m){
  if(!m.series||!m.series.length)return '';
  const W=600,H=220,pl=46,pr=14,pt=14,pb=30;
  const x0=a.inst,lastY=pd(m.tDate).getFullYear()+pd(m.tDate).getMonth()/12;
  let endY=Math.max(pd(TODAY).getFullYear()+1,lastY+1);const hitY=m.cr>0?lastY+(m.tLast-m.tmin)/m.cr:null;
  if(hitY&&hitY<endY+15)endY=Math.max(endY,Math.min(hitY+1,lastY+25));
  const y0=Math.max(0,m.tmin-1),y1=a.tnom+0.5;
  const X=v=>pl+(v-x0)/(endY-x0)*(W-pl-pr),Y=v=>pt+(1-(v-y0)/(y1-y0))*(H-pt-pb);
  const yr=d=>{const q=pd(d);return q.getFullYear()+q.getMonth()/12+q.getDate()/365};
  const pts=[[x0+0.5,a.tnom]].concat(m.series.map(s=>[yr(s.d),s.t]));
  let s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;font-family:IBM Plex Sans;font-size:11px">';
  for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4;s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#eef1f4"/><text x="'+(pl-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" fill="#5d6b78">'+v.toFixed(1)+'</text>'}
  const step=Math.max(1,Math.ceil((endY-x0)/8));for(let y=Math.ceil(x0);y<=endY;y+=step)s+='<text x="'+X(y)+'" y="'+(H-10)+'" text-anchor="middle" fill="#5d6b78">'+y+'</text>';
  s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(m.tmin)+'" y2="'+Y(m.tmin)+'" stroke="#d0342c" stroke-dasharray="5 4"/><text x="'+(pl+6)+'" y="'+(Y(m.tmin)-5)+'" fill="#d0342c">t min '+m.tmin.toFixed(2)+' mm</text>';
  const tx=X(yr(TODAY));s+='<line x1="'+tx+'" x2="'+tx+'" y1="'+pt+'" y2="'+(H-pb)+'" stroke="#9aa7b3" stroke-dasharray="2 3"/><text x="'+(tx+4)+'" y="'+(pt+10)+'" fill="#5d6b78">today</text>';
  if(hitY){const ex=Math.min(hitY,endY);s+='<line x1="'+X(pts[pts.length-1][0])+'" y1="'+Y(m.tLast)+'" x2="'+X(ex)+'" y2="'+Y(m.tLast-m.cr*(ex-pts[pts.length-1][0]))+'" stroke="#ec7a1c" stroke-width="2" stroke-dasharray="6 4"/>'}
  s+='<polyline fill="none" stroke="#0b7a8a" stroke-width="2" points="'+pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')+'"/>';
  pts.forEach((p,i)=>{s+='<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="4" fill="'+(i?'#0b7a8a':'#fff')+'" stroke="#0b7a8a" stroke-width="2"><title>'+(i?'Governing min ':'Nominal ')+p[1].toFixed(2)+' mm</title></circle>'});
  return s+'</svg><div class="muted" style="font-size:12px">Governing minimum thickness per survey (teal) and projection at the governing corrosion rate (orange) to t<sub>min</sub>.</div>';
}

function saveRecord(tag,tplId){
  const tpl=tplById(tplId),a=assetBy(tag);const data={};let readings=null;
  for(const [fi,f] of tpl.fields.entries()){
    if(f.t==='cml'){
      readings=[];const ids=[...document.querySelectorAll('#cmltbl .cml-id')],ts=[...document.querySelectorAll('#cmltbl .cml-t')];
      ids.forEach((e,i)=>{const t=parseFloat(ts[i].value);if(e.value.trim()&&!isNaN(t))readings.push({cml:e.value.trim(),t:r2(t)})});
      if(!readings.length){toast('Enter at least one thickness reading');return}
      if(readings.some(r=>r.t<=0||r.t>a.tnom*1.5)){toast('Check readings: values must be between 0 and 1.5 × nominal');return}
    }else{let v=val('rf-'+fi);if(f.t==='num'||f.t==='grade')v=v===''?null:+v;data[f.k]=v}
  }
  const date=val('r-date')||TODAY;if(date>TODAY){toast('Inspection date cannot be in the future');return}
  const ids=DB.inspections.map(i=>+i.id.split('-')[1]);const id='IR-'+pad(Math.max(0,...ids)+1,4);
  const rec={id,tag,date,tpl:tplId,inspector:val('r-insp')||'—',readings,data,grade:gradeFor(tpl,data)};
  DB.inspections.push(rec);
  DB.documents.push({no:id+'-RPT',title:'Inspection report — '+tpl.name+' — '+tag,type:'Inspection report',rev:'0',tags:[tag]});
  save();computeAll();
  const m=M[tag];const finds=[];
  if(readings){if(m.tLast<m.tmin)finds.push('Measured thickness '+m.tLast+' mm is below t min ('+m.tmin+' mm).');else if(m.rl<5)finds.push('Remaining life is '+fmt(Math.max(0,m.rl),1)+' years.');}
  if(rec.grade>=3)finds.push('Condition grade '+rec.grade+'.');
  const sum='<p><b>'+id+'</b> saved for '+esc(tag)+'.</p><div class="kv"><div><span>Risk now</span>'+rb(m.risk)+'</div><div><span>Next due</span>'+fd(m.due)+'</div>'+(readings?'<div><span>Remaining life</span>'+fmt(Math.max(0,m.rl),1)+' y</div>':'<div><span>Grade</span>'+gradeBadge(rec.grade)+'</div>')+'</div>';
  if(finds.length){
    const pri=(readings&&m.tLast<m.tmin)||rec.grade===4?'P1':(m.rl!=null&&m.rl<2)?'P1':'P2';
    openModal('Inspection saved — finding detected',sum+'<p style="margin-top:14px;color:var(--H)"><b>Finding:</b> '+esc(finds.join(' '))+'</p><p class="hint">Raise an anomaly to track the actions?</p>','<button class="btn" data-a="close-modal">Not now</button><button class="btn pri" data-a="raise" data-tag="'+esc(tag)+'" data-pri="'+pri+'" data-title="'+esc(finds[0])+'">Raise anomaly ('+pri+')</button>');
  }else openModal('Inspection saved',sum,'<button class="btn pri" data-a="close-modal">Done</button>');
  refresh();
}

function saveAsset(tag){

    dp:+val('f-dp')||0,dt:+val('f-dt')||0,od:+val('f-od')||0,tnom:+val('f-tnom')||0,dms:val('f-dms').split(',').map(s=>s.trim()).filter(Boolean)};
  if(o.od>0&&o.tnom>0&&tminOf(o)>=o.tnom){toast('Nominal thickness is below the required minimum for this pressure. Check the inputs.');return}

  const el=e.target;const a=el.dataset&&el.dataset.a;if(!a)return;const d=el.dataset;
  if(a==='cls-filter'){UI.cls=el.value;refresh()}
  else if(a==='an-status'){UI.anStatus=el.value;refresh()}
  else if(a==='an-pri'){UI.anPri=el.value;refresh()}
  else if(a==='strat-cls'){UI.stratCls=el.value;refresh()}
  else if(a==='doc-type'){UI.docType=el.value;refresh()}
  else if(a==='rec-tpl')recordForm(d.tag,el.value);
  else if(a==='crit'){assetBy(d.tag).crit[d.k]=+el.value;save();computeAll();refresh()}
  else if(a==='interval'){const v=Math.max(1,Math.min(240,+el.value||1));DB.settings.intervals[d.k]=v;save();computeAll();refresh()}
  else if(a==='stress'){const v=+el.value;if(v>=10){DB.settings.stress[d.k]=v;save();computeAll();refresh()}}
  else if(a==='an-setstatus'){const x=DB.anomalies.find(q=>q.id===d.id);if(el.value==='Closed'&&x.actions.some(ac=>!ac.done)){toast('Complete all actions before closing');el.value=x.status;return}x.status=el.value;save();computeAll();refresh();anView(d.id)}
  else if(a==='an-setpri'){DB.anomalies.find(q=>q.id===d.id).priority=el.value;save();computeAll();refresh();anView(d.id)}
});

computeAll();route();
})();
</script>
